<script>
function populateMetaFilters(meta) {
  populateSelect('statusFilter', meta.statuses || [], 'All Statuses');
  populateSelect('channelFilter', meta.channels || [], 'All Channels');
}

function populateSelect(id, values, placeholder) {
  const sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = '';
  if (placeholder != null) {
    const o = document.createElement('option');
    o.value = '';
    o.textContent = placeholder;
    sel.appendChild(o);
  }
  values.forEach(function (v) {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  });
}

function renderTicketList(tickets) {
  const list = document.getElementById('ticketList');
  const countEl = document.getElementById('ticketsCount');
  if (!list) return;
  tickets = tickets || [];
  if (countEl) countEl.textContent = tickets.length;
  if (!tickets.length) {
    list.innerHTML = '<div class="text-center text-gray-400 text-sm py-12">No tickets found</div>';
    return;
  }
  list.innerHTML = '';
  tickets.forEach(function (ticket) {
    const active = ticket.id === appState.selectedTicketId;
    const pri = getPriority(ticket);
    const card = document.createElement('button');
    card.type = 'button';
    card.dataset.id = ticket.id;
    card.className = 'w-full text-left p-3 rounded-lg border border-gray-100 hover:bg-gray-50 transition ' +
      (active ? 'ticket-card-active border-blue-200' : 'bg-white');
    card.innerHTML =
      '<div class="flex items-center justify-between gap-2 mb-1">' +
        '<span class="font-semibold text-sm text-gray-900">' + escapeHtml(ticket.id) + '</span>' +
        '<span class="text-xs font-medium px-2 py-0.5 rounded-full ' + priorityClasses(pri) + '">' + escapeHtml(pri) + '</span>' +
      '</div>' +
      '<p class="text-sm font-medium text-gray-800 mb-2 line-clamp-2">' + escapeHtml(getSubject(ticket)) + '</p>' +
      '<div class="flex items-center gap-3 text-xs text-gray-500 mb-2">' +
        '<span class="inline-flex items-center gap-1">' +
          '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>' +
          escapeHtml(ticket.customerName || 'Unknown') +
        '</span>' +
        '<span class="inline-flex items-center gap-1">' +
          '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
          escapeHtml(formatDate(ticket.createdAt)) +
        '</span>' +
      '</div>' +
      '<div class="flex flex-wrap gap-1.5">' +
        '<span class="text-xs px-2 py-0.5 rounded-full ' + statusClasses(ticket.status) + '">' + escapeHtml(ticket.status || 'Pending') + '</span>' +
        '<span class="text-xs px-2 py-0.5 rounded-full ' + channelClasses() + '">' + escapeHtml(ticket.channel || '—') + '</span>' +
      '</div>';
    card.addEventListener('click', function () { selectTicket(ticket.id); });
    list.appendChild(card);
  });
}

function renderInsights(result) {
  const tickets = result.tickets || [];
  const total = result.total || 0;
  const resolved = tickets.filter(function (t) { return t.status === 'Resolved'; }).length;
  const active = tickets.filter(function (t) { return t.status && t.status !== 'Resolved'; }).length;
  const escalated = tickets.filter(function (t) { return t.escalation && t.escalation !== 'Unassigned'; }).length;
  const highPri = tickets.filter(function (t) { return getPriority(t) === 'High'; }).length;

  setText('totalTickets', total);
  setText('resolvedTickets', resolved);
  setText('activeTickets', active);
  setText('escalatedTickets', escalated);
  setText('highPriorityTickets', highPri);

  renderStatusBreakdown(tickets, total);
  renderChannelDistribution(tickets, total);
  renderTopThemes(tickets);
  renderResolutionRate(resolved, total);
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function renderStatusBreakdown(tickets, total) {
  const el = document.getElementById('statusBreakdown');
  if (!el) return;
  const statuses = (appState.meta && appState.meta.statuses) || [];
  if (!total) {
    el.innerHTML = '<p class="text-gray-400">No data</p>';
    return;
  }
  el.innerHTML = statuses.map(function (s) {
    const n = tickets.filter(function (t) { return t.status === s; }).length;
    const pct = Math.round((n / total) * 100);
    return '<div><div class="flex justify-between text-xs mb-1"><span class="text-gray-700">' + escapeHtml(s) + '</span><span class="text-gray-500">' + n + ' (' + pct + '%)</span></div>' +
      '<div class="h-1.5 bg-gray-100 rounded-full"><div class="h-full bg-blue-500 rounded-full" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

function renderChannelDistribution(tickets, total) {
  const el = document.getElementById('channelDistribution');
  if (!el) return;
  const channels = (appState.meta && appState.meta.channels) || [];
  if (!total) {
    el.innerHTML = '<p class="text-gray-400">No data</p>';
    return;
  }
  const max = Math.max(1, ...channels.map(function (c) {
    return tickets.filter(function (t) { return t.channel === c; }).length;
  }));
  el.innerHTML = channels.map(function (c) {
    const n = tickets.filter(function (t) { return t.channel === c; }).length;
    const w = Math.round((n / max) * 100);
    return '<div class="flex items-center gap-2"><span class="w-20 text-xs text-gray-600 truncate">' + escapeHtml(c) + '</span>' +
      '<div class="flex-1 h-1.5 bg-gray-100 rounded-full"><div class="h-full bg-green-500 rounded-full" style="width:' + w + '%"></div></div>' +
      '<span class="text-xs text-gray-500 w-6 text-right">' + n + '</span></div>';
  }).join('');
}

function renderTopThemes(tickets) {
  const el = document.getElementById('topQueryThemes');
  if (!el) return;
  const map = {};
  tickets.forEach(function (t) {
    const k = t.category || 'Other';
    map[k] = (map[k] || 0) + 1;
  });
  const sorted = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; }).slice(0, 5);
  if (!sorted.length) {
    el.innerHTML = '<p class="text-gray-400">No data</p>';
    return;
  }
  el.innerHTML = sorted.map(function (theme, i) {
    return '<div class="flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 text-xs font-semibold flex items-center justify-center">' + (i + 1) + '</span>' +
      '<div><p class="font-medium text-gray-800">' + escapeHtml(theme) + '</p><p class="text-xs text-gray-500">' + map[theme] + ' ticket' + (map[theme] > 1 ? 's' : '') + '</p></div></div>';
  }).join('');
}

function renderResolutionRate(resolved, total) {
  const pct = total ? Math.round((resolved / total) * 100) : 0;
  setText('resolutionRateText', pct + '%');
  setText('resolutionRateSub', resolved + ' of ' + total + ' tickets');
  const bar = document.getElementById('resolutionRateBar');
  if (bar) bar.style.width = pct + '%';
}

function iconUser() {
  return '<svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>';
}

function renderTicketDetailView(ticket) {
  const detail = document.getElementById('ticketDetail');
  if (!detail) return;
  const pri = getPriority(ticket);
  const esc = ticket.escalation && ticket.escalation !== 'Unassigned' ? ticket.escalation : 'None';
  detail.className = 'panel-scroll flex-1 min-h-0 overflow-y-auto p-5 text-sm';
  detail.innerHTML =
    '<div class="flex items-start justify-between gap-3 mb-4">' +
      '<div><p class="text-xs text-gray-500 mb-1">' + escapeHtml(ticket.id) + '</p>' +
      '<h3 class="text-lg font-bold text-gray-900 leading-snug">' + escapeHtml(getSubject(ticket)) + '</h3></div>' +
      '<span class="text-xs font-medium px-2.5 py-1 rounded-full shrink-0 ' + priorityClasses(pri) + '">' + escapeHtml(pri) + ' Priority</span>' +
    '</div>' +
    '<p class="text-xs font-medium text-gray-500 mb-1">Status</p>' +
    '<span class="inline-block text-xs font-medium px-2.5 py-1 rounded-lg border mb-4 ' + statusClasses(ticket.status) + ' border-current">' + escapeHtml(ticket.status) + '</span>' +
    '<div class="bg-gray-50 rounded-xl p-4 mb-4 border border-gray-100">' +
      '<p class="font-semibold text-gray-900 mb-3">Customer Information</p>' +
      infoRow(iconUser(), escapeHtml(ticket.customerName)) +
      infoRow(mailIcon(), escapeHtml(ticket.email || 'N/A')) +
      infoRow(phoneIcon(), escapeHtml(ticket.phone || 'N/A')) +
      infoRow(boxIcon(), escapeHtml(ticket.orderId || 'N/A')) +
    '</div>' +
    '<p class="font-semibold text-gray-900 mb-1">Description</p>' +
    '<p class="text-gray-600 mb-4">' + escapeHtml(ticket.description || 'No description') + '</p>' +
    '<div class="grid grid-cols-2 gap-4 mb-4 text-sm">' +
      metaCell('Channel', ticket.channel) +
      metaCell('Priority', pri) +
      metaCell('Query Theme', ticket.category || '—') +
      metaCell('Escalated To', esc) +
    '</div>' +
    '<p class="font-semibold text-gray-900 mb-1">Action Taken</p>' +
    '<p class="text-gray-600 mb-4">' + escapeHtml(ticket.resolutionNotes || 'Pending review') + '</p>' +
    '<p class="font-semibold text-gray-900 mb-1">Internal Notes</p>' +
    '<p class="text-gray-400 mb-4">' + escapeHtml(ticket.transcript || 'No notes added') + '</p>' +
    (ticket.attachments ? '<p class="font-semibold text-gray-900 mb-1">Attachments</p><a href="' + escapeHtml(ticket.attachments) + '" target="_blank" class="text-blue-600 hover:underline">Open attachment</a>' : '') +
    '<div id="orderDetails" class="mt-4 pt-4 border-t border-gray-100 text-gray-500">Loading order details…</div>' +
    '<div class="flex flex-wrap gap-4 mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500">' +
      '<span class="inline-flex items-center gap-1">' + clockIcon() + ' Created: ' + escapeHtml(formatDate(ticket.createdAt)) + '</span>' +
      '<span class="inline-flex items-center gap-1">' + clockIcon() + ' Last Updated: ' + escapeHtml(formatDate(ticket.updatedAt || ticket.createdAt)) + '</span>' +
    '</div>';
  loadOrderDetails(ticket.orderId);
  updateSelectedSummary(ticket);
}

function infoRow(icon, text) {
  return '<div class="flex items-center gap-2 text-gray-700 mb-2">' + icon + '<span>' + text + '</span></div>';
}
function metaCell(label, val) {
  return '<div><p class="text-xs text-gray-500">' + escapeHtml(label) + '</p><p class="font-medium text-gray-900">' + escapeHtml(val || '—') + '</p></div>';
}
function mailIcon() {
  return '<svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>';
}
function phoneIcon() {
  return '<svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>';
}
function boxIcon() {
  return '<svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>';
}
function clockIcon() {
  return '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
}

function updateSelectedSummary(ticket) {
  const box = document.getElementById('selectedSummary');
  if (!box || !ticket) return;
  box.classList.remove('hidden');
  setText('summaryId', ticket.id);
  setText('summaryCustomer', ticket.customerName);
  setText('summaryCreated', 'Created: ' + formatDate(ticket.createdAt));
}

function loadOrderDetails(orderId) {
  const orderDiv = document.getElementById('orderDetails');
  if (!orderDiv) return;
  if (!orderId) {
    orderDiv.innerHTML = '';
    return;
  }
  google.script.run
    .withSuccessHandler(function (result) {
      if (!result.success || !result.order) {
        orderDiv.innerHTML = '<p class="text-gray-400 text-sm">No linked order found.</p>';
        return;
      }
      const o = result.order;
      orderDiv.innerHTML =
        '<p class="font-semibold text-gray-900 mb-2">Linked Order</p>' +
        '<div class="grid grid-cols-2 gap-3 text-sm">' +
        metaCell('Order ID', o.orderId) + metaCell('Product', o.product) +
        metaCell('Amount', o.amount) + metaCell('Status', o.status) +
        '</div>';
    })
    .withFailureHandler(function () {
      orderDiv.innerHTML = '<p class="text-red-500 text-sm">Order load failed.</p>';
    })
    .getOrderDetails(orderId);
}

function renderTicketEditForm(ticket, meta) {
  const detail = document.getElementById('ticketDetail');
  if (!detail) return;
  const statuses = (meta && meta.statuses) || ['Pending', 'In Progress', 'Resolved'];
  const escalations = (meta && meta.escalations) || ['Unassigned', 'Support Team'];
  function opts(vals, sel) {
    return vals.map(function (v) {
      return '<option value="' + escapeHtml(v) + '"' + (v === sel ? ' selected' : '') + '>' + escapeHtml(v) + '</option>';
    }).join('');
  }
  detail.className = 'panel-scroll flex-1 min-h-0 overflow-y-auto p-5 text-sm';
  detail.innerHTML =
    '<div class="space-y-4 max-w-lg">' +
    '<p class="font-semibold">Editing ' + escapeHtml(ticket.id) + '</p>' +
    field('Customer Name', '<input id="edit_customerName" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" value="' + escapeHtml(ticket.customerName) + '" />') +
    field('Email', '<input id="edit_email" type="email" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" value="' + escapeHtml(ticket.email) + '" />') +
    field('Phone', '<input id="edit_phone" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" value="' + escapeHtml(ticket.phone) + '" />') +
    field('Order ID', '<input id="edit_orderId" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" value="' + escapeHtml(ticket.orderId || '') + '" />') +
    field('Status', '<select id="edit_status" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2">' + opts(statuses, ticket.status) + '</select>') +
    field('Escalation', '<select id="edit_escalation" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2">' + opts(escalations, ticket.escalation) + '</select>') +
    field('Description', '<textarea id="edit_description" rows="4" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2">' + escapeHtml(ticket.description || '') + '</textarea>') +
    field('Resolution Notes', '<textarea id="edit_resolutionNotes" rows="3" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2">' + escapeHtml(ticket.resolutionNotes || '') + '</textarea>') +
    '</div>';
}

function field(label, input) {
  return '<label class="block text-sm font-medium text-gray-700">' + escapeHtml(label) + input + '</label>';
}

function enterEditMode() {
  if (!appState.selectedTicket) return;
  appState.editMode = true;
  renderTicketEditForm(appState.selectedTicket, appState.meta);
  showEditModeButtons();
}

function exitEditMode() {
  appState.editMode = false;
  if (appState.selectedTicket) renderTicketDetailView(appState.selectedTicket);
  showViewModeButtons();
}

function saveTicketChanges() {
  if (!appState.selectedTicket) return;
  const updated = Object.assign({}, appState.selectedTicket, {
    customerName: val('edit_customerName'),
    email: val('edit_email'),
    phone: val('edit_phone'),
    orderId: val('edit_orderId'),
    status: val('edit_status'),
    escalation: val('edit_escalation'),
    description: val('edit_description'),
    resolutionNotes: val('edit_resolutionNotes')
  });
  const saveBtn = document.getElementById('saveTicketButton');
  if (saveBtn) { saveBtn.textContent = 'Saving…'; saveBtn.disabled = true; }
  google.script.run
    .withSuccessHandler(function (result) {
      if (saveBtn) { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }
      if (!result.success) {
        showNotification(result.error || 'Save failed', 'error');
        return;
      }
      appState.selectedTicket = result.ticket;
      const idx = appState.tickets.findIndex(function (t) { return t.id === result.ticket.id; });
      if (idx !== -1) appState.tickets[idx] = result.ticket;
      appState.editMode = false;
      renderTicketDetailView(result.ticket);
      renderTicketList(appState.tickets);
      showViewModeButtons();
      showNotification('Ticket saved');
    })
    .withFailureHandler(function (err) {
      if (saveBtn) { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }
      showNotification(err.message || 'Save failed', 'error');
    })
    .updateTicket(updated);
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

function showViewModeButtons() {
  toggleBtn('editTicketButton', false);
  toggleBtn('saveTicketButton', true);
  toggleBtn('cancelEditButton', true);
}

function showEditModeButtons() {
  toggleBtn('editTicketButton', true);
  toggleBtn('saveTicketButton', false);
  toggleBtn('cancelEditButton', false);
}

function toggleBtn(id, hide) {
  const el = document.getElementById(id);
  if (!el) return;
  if (hide) el.classList.add('hidden');
  else el.classList.remove('hidden');
}
</script>
