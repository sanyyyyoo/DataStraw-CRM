<script>
function selectTicket(ticketId) {
  appState.selectedTicketId = ticketId;
  var ticket = appState.tickets.find(function (t) { return t.id === ticketId; });
  appState.selectedTicket = ticket;
  if (!ticket) {
    var detail = document.getElementById('ticketDetail');
    if (detail) detail.innerHTML = '<p class="text-gray-400">Ticket not found</p>';
    return;
  }
  appState.editMode = false;
  renderTicketDetailView(ticket);
  showViewModeButtons();
  renderTicketList(appState.tickets);
}

function applyFilters() {
  loadTickets();
}

function clearTicketDetail() {
  appState.selectedTicketId = null;
  appState.selectedTicket = null;
  appState.editMode = false;
  var detail = document.getElementById('ticketDetail');
  if (detail) {
    detail.innerHTML =
      '<div class="flex flex-col items-center justify-center py-16 text-center text-gray-400">' +
      '<svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
      '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>' +
      '<p class="text-sm font-medium">Select a ticket from the list</p>' +
      '<p class="text-xs mt-1">Details will appear here</p></div>';
  }
  var summary = document.getElementById('selectedSummary');
  if (summary) summary.classList.add('hidden');
  toggleBtn('editTicketButton', true);
  toggleBtn('saveTicketButton', true);
  toggleBtn('cancelEditButton', true);
}
</script>
